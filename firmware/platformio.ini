; PlatformIO project for the Homerun Arduino Mega 2560 firmware.
;
; Flash with:   pio run -e megaatmega2560 -t upload
; Monitor with: pio device monitor -b 115200
;
; The Qlima A/C control uses ToniA/arduino-heatpumpir (Qlima/Carrier protocol).
; IR receive/decode is implemented directly in the firmware (see ir_recv.*),
; so no external IR library is required.

[platformio]
default_envs = megaatmega2560
src_dir = homerun_mega

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    https://github.com/ToniA/arduino-heatpumpir.git
build_flags =
    -Wall
