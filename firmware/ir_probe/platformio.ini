; Standalone IR probe for identifying the A/C protocol.
; Flash: pio run -e megaatmega2560 -t upload   ·   Monitor: pio device monitor -b 115200
[platformio]
default_envs = megaatmega2560
src_dir = .

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
